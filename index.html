<body><title>SOL ELECTRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : barre de site + onglets en haut ; formulaire à gauche, fiche de résultats à droite (empilés sur téléphone) */
:root{
  --bg:#eef1ec; --surface:#ffffff; --sunk:#f5f7f4; --ink:#17231e; --muted:#5b6a62; --line:#d4dbd5;
  --sun:#d98f00; --pv:#1743b3; --water:#0d7681; --ok:#2c8547; --warn:#a96400; --bad:#c0352b;
  --f-disp:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#18201d; --sunk:#131a17; --ink:#e4ebe7; --muted:#93a39a; --line:#2b3631;
  --sun:#f0b23a; --pv:#86a3ff; --water:#4cc3cc; --ok:#62c482; --warn:#eaa443; --bad:#ff7366; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#18201d; --sunk:#131a17; --ink:#e4ebe7; --muted:#93a39a; --line:#2b3631;
  --sun:#f0b23a; --pv:#86a3ff; --water:#4cc3cc; --ok:#62c482; --warn:#eaa443; --bad:#ff7366; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pv);outline-offset:2px}
.num,td.n,.mono{font-variant-numeric:tabular-nums}

/* En-tête */
.top{background:var(--ink);color:var(--bg)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand h1{font-size:1.7rem;font-weight:700;line-height:1;letter-spacing:.03em}
.brand #coLogo{height:40px;max-width:120px;object-fit:contain;background:#fff;border-radius:7px;padding:3px}
.co-prev{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.co-prev img{max-height:70px;max-width:200px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px}
.brand small{display:block;font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tabs button{background:transparent;border:1px solid transparent;color:inherit;padding:7px 12px;border-radius:999px;font-weight:500;opacity:.75}
.tabs button[aria-selected="true"]{background:var(--sun);color:#1b1300;opacity:1;font-weight:600}
.tabs button:hover{opacity:1}

/* Site */
.site{background:var(--surface);border-bottom:1px solid var(--line)}
.site .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding-block:10px;align-items:end}
.site .hint{font-size:.78rem;color:var(--muted);grid-column:1/-1;margin-top:-4px}

main.wrap{padding-block:18px 40px}
.grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}

/* Formulaire */
.form{display:grid;gap:10px;min-width:0}
.intro{font-size:.88rem;color:var(--muted);padding:2px 4px;display:grid;gap:8px}
details.adv{border:1px dashed var(--line);border-radius:var(--r)}
details.adv>summary{cursor:pointer;padding:11px 14px;font:600 1rem var(--f-disp);color:var(--muted)}
details.adv>summary span{font:500 .75rem var(--f-body);margin-left:6px}
details.adv[open]>summary{color:var(--ink)}
details.adv>.form{padding:0 8px 8px}
details.tech{border-top:1px solid var(--line)}
details.tech>summary{cursor:pointer;padding:13px 16px;font:600 1.05rem var(--f-disp);display:flex;justify-content:space-between;gap:8px}
details.tech>summary span{font:500 .8rem var(--f-body);color:var(--muted)}
.next{display:flex;flex-wrap:wrap;gap:8px}
.intro b{color:var(--ink)}
.intro span{font:600 .72rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:6px}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.sec>summary{list-style:none;cursor:pointer;padding:11px 14px;font:600 1.05rem var(--f-disp);display:flex;justify-content:space-between;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font:500 1.1rem var(--f-mono);color:var(--muted)}
details.sec[open]>summary::after{content:"–"}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:0 14px 14px}
label.f{display:grid;gap:3px;min-width:0}
label.f>span{font-size:.8rem;color:var(--muted);line-height:1.25}
.in{display:flex;align-items:center;background:var(--sunk);border:1px solid var(--line);border-radius:7px;min-width:0}
.in:focus-within{border-color:var(--pv)}
.in input,.in select{border:0;background:transparent;padding:7px 9px;width:100%;min-width:0;outline:none}
.in em{font:500 .75rem var(--f-mono);color:var(--muted);padding-right:9px;white-space:nowrap;font-style:normal}
.site .in{background:var(--bg)}

/* Tableau des appareils */
.loads{padding:0 14px 14px;display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 64px 46px 50px 62px 30px;gap:5px;align-items:center}
.lrow.head{line-height:1.15;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
@media (max-width:520px){.lrow{grid-template-columns:repeat(4,minmax(0,1fr)) 28px}.lrow>input:first-child{grid-column:1/-1;font-weight:600}.lrow.head>span:first-child{display:none}.lrow{padding-bottom:6px;border-bottom:1px dashed var(--line)}.lrow.head{border:0;padding:0}}
.lrow input{width:100%;min-width:0;padding:6px 7px;border:1px solid var(--line);border-radius:6px;background:var(--sunk)}
.lrow .x{border:0;background:transparent;color:var(--muted);font-size:1.1rem;padding:0}
.lrow .x:hover{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:.8rem;color:var(--muted)}
.chip:hover{border-color:var(--pv);color:var(--pv)}
.ltot{font-size:.85rem;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.85rem}

/* Résultats */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;overflow:hidden}
.sheet-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:1.35rem}
.sheet-h p{margin:0;color:var(--muted);font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-bottom:1px solid var(--line)}
.stat{padding:12px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.stat b{display:block;font:700 1.55rem/1.1 var(--f-disp);font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat i{display:block;font-style:normal;font-size:.8rem;color:var(--muted)}
.stat.k-pv b{color:var(--pv)} .stat.k-sun b{color:var(--sun)} .stat.k-w b{color:var(--water)}
.blk{padding:14px 16px;border-bottom:1px solid var(--line);min-width:0}
.blk:last-child{border-bottom:0}
.blk h3{font-size:1.1rem;margin-bottom:8px;display:flex;align-items:baseline;gap:8px}
.blk h3 small{font:500 .72rem var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-weight:500;text-align:left;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
td.k{color:var(--muted);width:52%}
td.v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font:500 .78rem var(--f-mono);padding:1px 7px;border-radius:5px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.alerts{display:grid;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line)}
.al{padding:8px 11px;border-radius:7px;font-size:.88rem;border-left:4px solid}
.al.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.al.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.al.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.al.tip{border-color:var(--pv);background:color-mix(in srgb,var(--pv) 9%,transparent)}
.al{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.al .t{flex:1 1 220px;min-width:0}
.al .lv{font:600 .68rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;margin-right:6px}
.al.bad .lv{color:var(--bad)} .al.warn .lv{color:var(--warn)} .al.tip .lv{color:var(--pv)} .al.ok .lv{color:var(--ok)}
.al .fix{border:1px solid currentColor;background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 10px;font-size:.82rem;font-weight:600}
.al .fix:hover{background:var(--ink);color:var(--bg)}
.alerts h4{margin:0 0 2px;font:600 .95rem var(--f-disp)}
/* Recherche de lieu */
.loc{grid-column:1/-1;display:grid;gap:8px}
.loc .row{align-items:end}
.loc .grow{flex:1 1 220px}
.locmsg{font-size:.85rem;color:var(--muted)}
.locres{display:flex;flex-wrap:wrap;gap:6px}
.locres button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:.85rem;max-width:100%}
.locres button small{display:block;color:var(--muted);font-size:.75rem}
.locres button:hover{border-color:var(--pv)}
details.locd{border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
details.locd>summary{cursor:pointer;padding:8px 12px;font-weight:600;font-size:.9rem}
.locbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:0 12px 12px}
@media (max-width:700px){.locbody{grid-template-columns:minmax(0,1fr)}}
#locMap{height:230px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);z-index:0}
.mbars{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:end;height:90px;margin:8px 0 2px}
.mbars div{background:var(--sun);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.mbars div.min{background:var(--bad)}
.mlab{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font:500 .62rem var(--f-mono);color:var(--muted);text-align:center}
.irr{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.irr button{flex:1 1 150px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;text-align:left}
.irr button b{display:block;font:700 1.15rem var(--f-disp)}
.irr button span{font-size:.75rem;color:var(--muted)}
.irr button[aria-pressed="true"]{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--sunk);margin:6px 0 2px}
.bar>div{height:100%}
.legend{font-size:.78rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:0}
.note{font-size:.82rem;color:var(--muted);margin:8px 0 0}

/* Devis / projets */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.price{width:110px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);text-align:right}
.qty{width:70px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);text-align:right}
.total{font:700 1.6rem var(--f-disp);font-variant-numeric:tabular-nums}
.plist{display:grid;gap:8px;margin-top:12px}
.pitem{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.pitem b{font-weight:600}
.pitem small{color:var(--muted);display:block}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:8px;font:500 .8rem var(--f-mono)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;z-index:20}
.muted{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.tabs button,.btn,.chip{transition:background .15s,border-color .15s,color .15s}}
</style>

  <div class="wrap">
    <div class="brand">

</header>

<section class="site"><div class="wrap" id="siteBar"></div></section>

</main>
<div class="toast" id="toast" hidden></div>

/* Section de câble : chute de tension + courant admissible (Iz) */
function cable(o){
  const k=o.mode==="tri"?Math.sqrt(3)*(o.cos||0.85):o.mode==="mono"?2*(o.cos||1):2;
  const dU=o.U*o.du/100;
  const sCalc=RHO*k*o.L*o.I/dU;
  const need=Math.max(o.I,o.Iz||0);
  const s=SECTIONS.find(x=>x>=sCalc&&x>=(o.min||1.5)&&AMPA[x]>=need)??null;
  return {...o,sCalc,s,real:s?RHO*k*o.L*o.I/s/o.U*100:null};
}

/* Structure : portiques acier + rails alu */
function calcStruct(n,pn,st,lat){
  if(!n)return null;
  const tilt=Math.max(15,Math.round(Math.abs(lat)+5)),t=tilt*Math.PI/180;
  const w=st.orient==="portrait"?pn.W:pn.L, D=st.orient==="portrait"?pn.L:pn.W;
  const per=Math.max(1,Math.min(Math.round(st.perRow)||1,n)), rows=Math.ceil(n/per);
  let railBars=0,rails=0,mid=0,end=0,port=0,maxLen=0,frameLen=0;
  for(let r=0;r<rows;r++){
    const k=r<rows-1?per:n-per*(rows-1), len=k*w+(k-1)*0.02;
    maxLen=Math.max(maxLen,len);frameLen+=len;
    rails+=2*(len+0.1);railBars+=2*Math.ceil((len+0.1)/4.2);
    mid+=2*(k-1);end+=4;port+=Math.ceil(len/1.5)+1;
  }
  const hRear=st.h0+D*Math.sin(t), proj=D*Math.cos(t), diag=Math.hypot(proj,hRear-st.h0+0.3);
  const steel=port*(st.h0+hRear+D+diag);
  const elev=Math.max(20,90-Math.abs(lat)-23.45);
  const pitch=proj+D*Math.sin(t)/Math.tan(elev*Math.PI/180);
  return {tilt,rows,per,rails,railBars,mid,end,port,hRear,proj,pitch,maxLen,frameLen,
    steel,steelBars:Math.ceil(steel/6),anchors:port*2,bolts:port*6,
    area:((rows-1)*pitch+proj)*maxLen, face:lat>=0?"plein Sud":"plein Nord"};
}

  const b={...p0.bat,v:sv(p0.bat.v,12),ah:sv(p0.bat.ah,100),dod:Math.min(100,sv(p0.bat.dod,50))};
  let Ej=0,Pt=0,surge=0;
  p.loads.forEach(([,pw,q,h,k])=>{const P=(+pw||0)*(+q||0);Ej+=P*(+h||0);Pt+=P;surge=Math.max(surge,(+pw||0)*((+k||1)-1))});

  const nbS=Math.max(1,Math.round(vsys/batNom));
  const Cneed=Ej*p.autonomie/((b.dod/100)*vsys*p.etaInv);
  const nbP=Math.max(1,Math.ceil(Cneed/b.ah)), nbBat=nbS*nbP, Cinst=nbP*b.ah;

  const Ibat=Pinv*nInv/(vsys*0.9), Iac=Pinv*nInv/230;

  if(!li&&cRate<0.05)W.push(["warn","Courant de charge faible (moins de C/20) : des batteries plomb risquent de rester sous-chargées. Ajoutez des panneaux."]);

  // protections
  const ns=st.ns,np=st.np,isc=pn.isc,Udc=uClass(1.2*ns*pn.voc);
  const fuse=np>=3?up(STD_FUSE,1.5*isc):null;
  const bPV=up(STD_BRK,1.25*isc*np), bReg=up(STD_BRK,1.25*Ireg/nReg), bBat=up(STD_BRK,1.25*Ibat), bAC=up(STD_BRK,1.25*Iac), ddr=up(STD_DDR,bAC)||bAC;
  const C=[
    {id:"str",nom:"Chaîne PV → coffret DC",...cable({I:1.25*isc,L:p.L.str,U:ns*pn.vmp,du:p.du.pv/2,mode:"dc",min:4,Iz:fuse||0}),type:"solaire"},
    {id:"pv",nom:"Coffret DC → "+(hyb?"onduleur hybride":"régulateur"),...cable({I:1.25*isc*np,L:p.L.pv,U:ns*pn.vmp,du:p.du.pv/2,mode:"dc",min:4,Iz:bPV}),type:"solaire"},
    ...(hyb?[]:[{id:"reg",nom:"Régulateur → batteries",...cable({I:Ireg/nReg,L:p.L.reg,U:vsys,du:p.du.bat,mode:"dc",min:6,Iz:bReg}),type:"batterie"}]),
    {id:"bat",nom:"Batteries → onduleur",...cable({I:Ibat,L:p.L.bat,U:vsys,du:p.du.bat,mode:"dc",min:10,Iz:bBat}),type:"batterie"},
    {id:"ac",nom:"Onduleur → tableau AC",...cable({I:Iac,L:p.L.ac,U:230,du:p.du.ac,mode:"mono",cos:1,min:2.5,Iz:bAC}),type:"ac"}];
  C.forEach(c=>{if(!c.s)W.push(["bad",`Câble « ${c.nom} » : aucune section standard ne convient. Raccourcissez la liaison ou augmentez la tension.`])});
  const P=[
    ...(fuse?[["Fusibles gPV par chaîne",`${fuse} A · 1000 V DC`,`${np*2} fusibles (+ et −) avec porte-fusibles`]]:[["Fusibles de chaîne","Non obligatoires",`${np} chaîne(s) en parallèle (obligatoires à partir de 3)`]]),

/* ================= Calcul pompage ================= */
function calcPump(){
  const u0=S.pump,pn=safePanel(),hsp=sv(S.site.hsp,5),W=[];
  const u={...u0,q:Math.max(0,+u0.q||0),eta:sv(u0.eta,0.45),fp:sv(u0.fp,0.8),cos:sv(u0.cos,0.82),du:sv(u0.du,3),vocMax:sv(u0.vocMax,450),udc:sv(u0.udc,48),mat:sv(u0.mat,150)};
  const Qh=u.q/hsp, Qs=Qh/3600, D=u.d/1000, Chw=+u.mat;
  const Lp=u.inst+u.hres+u.dist, Hg=u.ndyn+u.hres;
  const J=D>0?10.67*Lp*Math.pow(Qs,1.852)/(Math.pow(Chw,1.852)*Math.pow(D,4.87))*1.1:0;
  const HMT=Hg+J, v=D>0?Qs/(Math.PI*D*D/4):0;
  const Ehyd=2.725*u.q*HMT, Phyd=2.725*Qh*HMT, Pel=Phyd/u.eta;
  const Pmot=up(PUMPS,Pel/1000)||PUMPS.at(-1);
  const Pc1=Ehyd/(u.eta*hsp*u.fp), Pc2=1.3*Pmot*1000, Pc=Math.max(Pc1,Pc2);
  const Nmin=Math.max(1,Math.ceil(Pc/pn.p));
  const st=strings(Nmin,pn,u.vmpMin,u.vocMax);
  if(st.err)W.push(["bad",st.err]);
  oversize(W,st,Nmin,"du variateur de pompe");
  const N=st.tot,Pinst=N*pn.p,ns=st.ns,np=st.np;
  if(Pc2>Pc1)W.push(["ok","Le champ PV est dimensionné par la puissance de démarrage de la pompe (1,3 × puissance moteur)."]);
  const U=u.type==="tri"?380:u.type==="mono"?230:u.udc;
  const Im=u.type==="tri"?Pmot*1000/(Math.sqrt(3)*380*u.cos*0.85):u.type==="mono"?Pmot*1000/(230*u.cos*0.85):Pmot*1000/(u.udc*0.85);
  const isc=pn.isc,Udc=uClass(1.2*ns*pn.voc),fuse=np>=3?up(STD_FUSE,1.5*isc):null,bPV=up(STD_BRK,1.25*isc*np);
  const C=[
    {id:"pv",nom:"Champ PV → variateur",...cable({I:1.25*isc*np,L:u.lpv,U:ns*pn.vmp,du:u.du,mode:"dc",min:4,Iz:bPV}),type:"solaire"},
    {id:"pompe",nom:"Variateur → pompe (câble immergé)",...cable({I:Im,L:u.inst+u.lcab,U,du:u.du,mode:u.type==="tri"?"tri":u.type==="mono"?"mono":"dc",cos:u.cos,min:1.5,Iz:Im*1.25}),type:"immergé"}];
  C.forEach(c=>{if(!c.s)W.push(["bad",`Câble « ${c.nom} » : aucune section standard ne convient.`])});
  const P=[
    ...(fuse?[["Fusibles gPV par chaîne",`${fuse} A · 1000 V DC`,`${np*2} fusibles avec porte-fusibles`]]:[["Fusibles de chaîne","Non obligatoires",`${np} chaîne(s) en parallèle`]]),
    ["Interrupteur-sectionneur DC PV",`${bPV} A · ${Udc} V DC`,"Entre le champ PV et le variateur"],
    ["Parafoudre DC type 2",`Ucpv ≥ ${Udc} V`,"Coffret DC, relié à la terre"],
    ["Sonde de niveau bas","Électrodes ou flotteur","Arrête la pompe si le forage est à sec"],
    ["Flotteur de réservoir","Contact sec","Arrête la pompe quand le réservoir est plein"],
    ["Protection moteur","Intégrée au variateur","Surintensité, sous-tension, marche à sec"],
    ["Mise à la terre","Piquet 1,5 m + câble 16 mm²","Variateur, structure, cadres des panneaux"]];
  const R={Qh,Qs,D,Lp,Hg,J,HMT,v,Ehyd,Phyd,Pel,Pmot,Pc1,Pc2,Pc,Nmin,st,N,Pinst,ns,np,U,Im,C,P,W,fuse,bPV,Udc,
    res:u.q*u.res, S:calcStruct(N,pn,u.st,+S.site.lat||0)};
  checkPump(W,R);return R;
}

function locGps(){
  if(!navigator.geolocation){locMsg("La localisation n'est pas disponible sur cet appareil.");return}
  locMsg("Localisation en cours… Autorisez l'accès à votre position si le téléphone le demande.");
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude,lon=pos.coords.longitude;let name="Ma position",full=`${fmt(lat,4)}, ${fmt(lon,4)}`;
    try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&accept-language=fr&lat=${lat}&lon=${lon}`);
      if(r.ok){const j=await r.json();if(j&&j.display_name){full=j.display_name;name=j.name||j.address?.village||j.address?.town||j.address?.city||name}}}catch(e){}
    LOC.results=[{name,full,lat,lon}];pickLoc(0);
  },err=>locMsg(err.code===1?"Localisation refusée : autorisez l'accès à la position dans les réglages, ou recherchez le lieu par son nom.":"Position introuvable. Activez le GPS ou recherchez le lieu par son nom."),
  {enableHighAccuracy:true,timeout:20000,maximumAge:60000});

async function pickLoc(i,keepName){
  const x=LOC.results[i];LOC.results=[];renderLocRes();
  Object.assign(S.site,{city:"custom",place:keepName?S.site.place:x.name,lat:r2(x.lat),lon:r2(x.lon),months:[]});
  syncInputs();refresh();renderLocInfo(true);
  locMsg("Récupération de l'ensoleillement (NASA)…");
  try{
    const r=await fetch(`https://power.larc.nasa.gov/api/temporal/climatology/point?parameters=ALLSKY_SFC_SW_DWN&community=RE&longitude=${x.lon.toFixed(4)}&latitude=${x.lat.toFixed(4)}&format=JSON`);

  if(!(+b.dod>=20&&+b.dod<=100))W.push(["bad",`Décharge maximale de ${fmt(b.dod)} % impossible.`,{label:`Corriger : ${chem==="li"?80:50} %`,set:{"pv.bat.dod":chem==="li"?80:50}}]);

  else if(chem==="li"&&+b.dod>90)W.push(["warn",`Batteries lithium déchargées à ${fmt(b.dod)} % : gardez une marge, 80 % est conseillé.`,{label:"Corriger : 80 %",set:{"pv.bat.dod":80}}]);

function checkPump(W,r){

  if(+u.hres<0)W.push(["bad","Hauteur du réservoir négative.",{label:"Corriger : 0 m",set:{"pump.hres":0}}]);

  if(u.type==="mono"&&r.Pmot>2.2)W.push(["warn",`Pompe de ${fmt(r.Pmot,2)} kW : les variateurs monophasés dépassent rarement 2,2 kW. Passez en triphasé.`,{label:"Appliquer : triphasée",set:{"pump.type":"tri","pump.vmpMin":450,"pump.vocMax":800}}]);

function structBom(add,s){
  if(!s)return;
  add("rail","Rail aluminium 4,2 m",s.railBars,"barre");
  add("corniere","Cornière acier galvanisé 40×40×4 (6 m)",s.steelBars,"barre");
  add("bride-mid","Bride intermédiaire",s.mid,"u");
  add("bride-end","Bride d'extrémité",s.end,"u");
  add("ancrage","Platine d'ancrage + chevilles",s.anchors,"u");
  add("boulon","Boulon M10 galvanisé",s.bolts,"u");
}
function bom(src){
  const L=[],idx={};
  const add=(key,n,q,u)=>{if(!q)return;q=Math.ceil(q*10)/10;if(idx[key]!==undefined){L[idx[key]].q+=q}else{idx[key]=L.length;L.push({key,n,q,u})}};
  const pn=S.panel;
  const cab=(c,mult,extra)=>c.s&&add(`cable-${c.type}-${c.s}`,{solaire:`Câble solaire ${fs(c.s)} mm² (rouge + noir)`,batterie:`Câble souple ${fs(c.s)} mm² (rouge + noir)`,ac:`Câble 3G${fs(c.s)} mm²`,"immergé":extra}[c.type]||c.nom,Math.ceil(c.L*mult),"m");
  if(src==="pv"){
    const r=calcPV(),b=r.b,p=S.pv;
    add("panel-"+pn.p,`Panneau solaire ${pn.p} Wc`,r.N,"u");
    add(`bat-${b.v}-${b.ah}`,`Batterie ${fmt(b.v,1)} V ${b.ah} Ah`,r.nbBat,"u");
    if(r.hyb)add(`ondh-${r.Pinv}-${r.vsys}`,`Onduleur hybride ${fmt(r.Pinv)} W ${r.vsys} V (MPPT ≥ ${r.reg} A, Voc ≥ ${fmt(r.ns*pn.voc*1.1)} V)`,r.nInv,"u");
    else{add(`ond-${r.Pinv}-${r.vsys}`,`Onduleur ${fmt(r.Pinv)} W ${r.vsys} V pur sinus`,r.nInv,"u");add(`reg-${r.reg}`,`Régulateur MPPT ${r.reg} A ${r.vsys} V (Voc ≥ ${fmt(r.ns*pn.voc*1.1)} V)`,r.nReg,"u")}
    r.C.forEach(c=>cab(c,c.id==="str"?2*r.np:c.id==="ac"?1:2));
    if(r.nbBat>1){const c=r.C.find(x=>x.id==="bat");c&&c.s&&add(`liaison-${c.s}`,`Câble de liaison batteries ${fs(c.s)} mm² avec cosses`,r.nbBat,"u")}
    add("mc4","Connecteurs MC4 (paires)",r.np*2+2,"paire");
    if(r.fuse)add(`fgpv-${r.fuse}`,`Fusible gPV ${r.fuse} A 1000 V + porte-fusible`,r.np*2,"u");
    add(`sect-${r.bPV}-${r.Udc}`,`Interrupteur-sectionneur DC ${r.bPV} A ${r.Udc} V`,1,"u");
    add(`spddc-${r.Udc}`,`Parafoudre DC type 2 ${r.Udc} V`,1,"u");
    if(!r.hyb)add(`dcb-${r.bReg}`,`Disjoncteur DC ${r.bReg} A (régulateur → batteries)`,r.nReg,"u");
    add(`dcb-${r.bBat}`,`Disjoncteur ou fusible DC ${r.bBat} A (batteries)`,1,"u");
    add(`acb-${r.bAC}`,`Disjoncteur AC ${r.bAC} A courbe C`,1,"u");
    add(`ddr-${r.ddr}`,`Interrupteur différentiel ${r.ddr} A 30 mA type A`,1,"u");
    add("spdac","Parafoudre AC type 2 230 V",1,"u");
    add("coffret-dc","Coffret DC étanche IP65",1,"u");add("coffret-ac","Coffret / tableau AC",1,"u");
    add("terre","Piquet de terre 1,5 m + raccord",1,"u");add("vj16","Câble vert-jaune 16 mm²",10,"m");
    r.S&&add("vj6","Câble vert-jaune 6 mm² (masses)",Math.ceil(r.S.frameLen+10),"m");
    structBom(add,r.S);
  }else{
    const r=calcPump(),u=S.pump,typ={tri:"triphasée 380 V",mono:"monophasée 230 V",dc:`DC ${u.udc} V`}[u.type];
    const cores=u.type==="tri"?"4G":u.type==="mono"?"3G":"2×";
    add(`pompe-${r.Pmot}`,`Pompe immergée ${fmt(r.Pmot,2)} kW ${typ} · ${fmt(r.Qh,1)} m³/h à ${fmt(r.HMT)} m`,1,"u");
    add(`var-${r.Pmot}`,`Variateur solaire de pompe ${fmt(r.Pmot,2)} kW`,1,"u");
    add("panel-"+pn.p,`Panneau solaire ${pn.p} Wc`,r.N,"u");
    r.C.forEach(c=>cab(c,c.id==="pv"?2:1,`Câble immergé ${cores}${fs(c.s)} mm²`));
    add(`conduite-${u.mat}-${u.d}`,`Conduite ${u.mat==="120"?"acier galvanisé":"PEHD"} Ø${u.d} mm intérieur`,Math.ceil(r.Lp),"m");
    add(`reservoir-${r.res}`,`Réservoir / château d'eau ${fmt(r.res,1)} m³`,1,"u");
    add("sonde","Sonde de niveau bas (marche à sec)",1,"u");add("flotteur","Flotteur de réservoir plein",1,"u");
    add("corde","Câble inox de sécurité de la pompe",Math.ceil(u.inst+5),"m");
    add("clapet","Clapet anti-retour + vanne",1,"u");add("compteur","Compteur d'eau",1,"u");
    add("mc4","Connecteurs MC4 (paires)",r.np*2+2,"paire");
    if(r.fuse)add(`fgpv-${r.fuse}`,`Fusible gPV ${r.fuse} A 1000 V + porte-fusible`,r.np*2,"u");
    add(`sect-${r.bPV}-${r.Udc}`,`Interrupteur-sectionneur DC ${r.bPV} A ${r.Udc} V`,1,"u");
    add(`spddc-${r.Udc}`,`Parafoudre DC type 2 ${r.Udc} V`,1,"u");
    add("coffret-dc","Coffret DC étanche IP65",1,"u");
    add("terre","Piquet de terre 1,5 m + raccord",1,"u");add("vj16","Câble vert-jaune 16 mm²",10,"m");
    r.S&&add("vj6","Câble vert-jaune 6 mm² (masses)",Math.ceil(r.S.frameLen+10),"m");
    structBom(add,r.S);
  }
  S.extra.forEach((e,i)=>add("extra-"+i,e[0],+e[1]||0,e[2]));
  return L;
}

        <label class="f" for="cur"><span>Devise</span><div class="in"><select id="cur">${CURRENCIES.map(c=>`<option ${c===CUR?"selected":""}>${c}</option>`).join("")}</select></div></label>

    <div class="tw" style="margin-top:14px"><table><thead><tr><th>Désignation</th><th class="n">Quantité</th><th class="n">Prix unitaire</th><th class="n">Total (${CUR})</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>

     <div class="fields" style="padding:12px 0 0">
       <label class="f" for="pj-name"><span>Nom du projet</span><div class="in"><input id="pj-name" value="${esc(S.project.name)}"></div></label>
       <label class="f" for="pj-client"><span>Client</span><div class="in"><input id="pj-client" value="${esc(S.project.client)}"></div></label></div>
     <div class="row" style="margin-top:12px"><button class="btn pri" id="pjSave">Enregistrer le projet</button><button class="btn" id="pjNew">Nouveau projet</button></div>
     <h3 style="font-size:1.1rem;margin-top:22px">Transférer vers un autre appareil</h3>
     <p class="note" style="margin-top:2px">Copiez le code du projet, envoyez-le (WhatsApp, e-mail), puis collez-le ici sur l'autre téléphone ou ordinateur.</p>
     <div class="row" style="margin:8px 0"><button class="btn sm" id="pjCopy">Copier le code du projet</button></div>
     <label class="f" for="pj-import"><span>Coller un code de projet</span><textarea id="pj-import" placeholder="Collez ici le code copié…"></textarea></label>
     <div class="row" style="margin-top:8px"><button class="btn sm" id="pjImport">Importer</button></div>
   </div>
   <div class="panel"><h2 style="font-size:1.4rem">Projets enregistrés <span class="muted" style="font:500 .9rem var(--f-body)">sur cet appareil</span></h2>
     <div class="plist">${list.length?list.map(p=>`<div class="pitem"><div><b>${esc(p.name)}</b><small>${esc(p.client||"Sans client")} · ${new Date(p.date).toLocaleDateString("fr-FR")}</small></div>
       <div class="row"><button class="btn sm" data-load="${p.id}">Ouvrir</button><button class="btn sm danger" data-del-p="${p.id}">${pendingDel===p.id?"Confirmer la suppression":"Supprimer"}</button></div></div>`).join("")
       :`<p class="muted">Aucun projet enregistré. Remplissez un dimensionnement puis cliquez sur « Enregistrer le projet ».</p>`}</div></div></div>`;
}

/* ================= Navigation et événements ================= */
function refresh(){
  $("citySave").hidden=S.site.city!=="custom";if(!$("citySave").hidden&&!$("city-name").value&&S.site.place)$("city-name").value=S.site.place;
  saveDraft();
  if(S.tab==="pv")renderPV();else if(S.tab==="pump")renderPump();else if(S.tab==="bom")renderBom();else renderProj();
}
function showTab(t){
  S.tab=t;
  ["pv","pump","bom","proj"].forEach(x=>{$("v-"+x).hidden=x!==t;$("tab-"+x).setAttribute("aria-selected",x===t)});
  document.querySelector(".site").hidden=!(t==="pv"||t==="pump");
  refresh();
}
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.k&&el.tagName!=="SELECT")return onField(el);
  if(el.dataset.l){const [i,j]=el.dataset.l.split(",").map(Number);S.pv.loads[i][j]=j===0?el.value:(parseFloat(el.value)||0);refresh();return}
  if(el.dataset.price!==undefined){PRICES[el.dataset.price]=parseFloat(el.value)||0;store.set("sd.prices",PRICES);
    const L=bom(S.bomSrc);const tot=L.reduce((a,it)=>a+(+PRICES[it.key]||0)*it.q,0);$("bomTotal").textContent=`${fmt(tot)} ${CUR}`;
    const td=el.closest("tr").children[3];const it=L.find(x=>x.key===el.dataset.price);td.textContent=it&&PRICES[it.key]?fmt(PRICES[it.key]*it.q):"—";return}
  if(el.dataset.ex){const [i,j]=el.dataset.ex.split(",").map(Number);S.extra[i][j]=j===1?(parseFloat(el.value)||0):el.value;saveDraft();return}
  if(el.id==="pj-name"){S.project.name=el.value;saveDraft()}
  if(el.id==="pj-client"){S.project.client=el.value;saveDraft()}
  if(el.dataset.co){CO[el.dataset.co]=el.value.trim();saveCompany();renderCompanyHeader()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="loc-q"){e.preventDefault();locSearch()}});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.k&&el.tagName==="SELECT")return onField(el);
  if(el.id==="cur"){CUR=el.value;store.set("sd.cur",CUR);renderBom()}
  if(el.id==="co-file"){loadLogo(el.files[0]);el.value=""}
  if(el.dataset.ex)renderBom();
});
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab)return showTab(b.dataset.tab);
  if(b.dataset.fix!==undefined)return applyFix(+b.dataset.fix);
  if(b.dataset.word)return downloadWord(b.dataset.word);
  if(b.dataset.goto){S.bomSrc=b.dataset.goto;showTab("bom");scrollTo(0,0);return}
  if(b.id==="locSearch")return locSearch();
  if(b.id==="locGps")return locGps();
  if(b.dataset.loc!==undefined)return pickLoc(+b.dataset.loc);
  if(b.dataset.irr){const v=b.dataset.irr==="min"?worst().v:annual();S.site.hsp=v;syncInputs();refresh();renderLocInfo(false);toast(`Ensoleillement : ${fmt(v,2)} kWh/m²/j`);return}
  if(b.dataset.del!==undefined){S.pv.loads.splice(+b.dataset.del,1);renderLoads();refresh();return}
  if(b.id==="addLoad"){S.pv.loads.push(["Nouvel appareil",100,1,4,1]);renderLoads();refresh();$(`ld-${S.pv.loads.length-1}-0`).select();return}
  if(b.dataset.quick!==undefined){S.pv.loads.push([...QUICK[+b.dataset.quick]]);renderLoads();refresh();return}
  if(b.dataset.src){S.bomSrc=b.dataset.src;refresh();return}
  if(b.id==="citySaveBtn"){const n=$("city-name").value.trim();if(!n){toast("Entrez le nom de la ville");$("city-name").focus();return}
    MY_CITIES[n]=[+S.site.hsp,+S.site.lat,hasLon()?+S.site.lon:"",monthsOK()?S.site.months.slice():[]];try{localStorage.setItem("sd.cities",JSON.stringify(MY_CITIES))}catch(e){}
    buildCities();S.site.city=n;buildForms();syncInputs();refresh();toast(`Ville « ${n} » enregistrée`);return}
  if(b.id==="addExtra"){S.extra.push(["Autre",1,"u"]);refresh();return}
  if(b.dataset.exdel!==undefined){S.extra.splice(+b.dataset.exdel,1);refresh();return}
  if(b.id==="copyBom")return copyText(bomText());
  if(b.id==="pjSave"){const list=store.get("sd.projects",[]);const name=S.project.name||"Projet sans nom";
    const i=list.findIndex(p=>p.name===name&&p.client===S.project.client);const item={id:i>=0?list[i].id:Date.now(),name,client:S.project.client,date:Date.now(),data:clone(S)};
    if(i>=0)list[i]=item;else list.unshift(item);store.set("sd.projects",list);toast(i>=0?"Projet mis à jour":"Projet enregistré");renderProj();return}
  if(b.id==="pjNew"){S=merge(DEF,{tab:"pv",project:{name:"Nouveau projet",client:""}});buildForms();syncInputs();showTab("pv");toast("Nouveau projet");return}
  if(b.dataset.load){const p=store.get("sd.projects",[]).find(x=>String(x.id)===b.dataset.load);if(p){S=merge(DEF,p.data);buildForms();syncInputs();showTab("pv");toast(`Projet « ${p.name} » ouvert`)}return}
  if(b.dataset.delP){if(pendingDel!==+b.dataset.delP){pendingDel=+b.dataset.delP;renderProj();return}
    store.set("sd.projects",store.get("sd.projects",[]).filter(x=>x.id!==pendingDel));pendingDel=null;toast("Projet supprimé");renderProj();return}
  if(b.id==="coDel"){CO.logo="";CO.lw=CO.lh=0;saveCompany();renderCompanyHeader();renderProj();toast("Logo retiré");return}
  if(b.id==="pjCopy")return copyText("SOLAIRE1:"+btoa(unescape(encodeURIComponent(JSON.stringify(S)))));
  if(b.id==="pjImport"){try{const t=$("pj-import").value.trim().replace(/^SOLAIRE1:/,"");S=merge(DEF,JSON.parse(decodeURIComponent(escape(atob(t)))));buildForms();syncInputs();showTab("pv");toast("Projet importé")}
    catch(err){toast("Code invalide : copiez le code complet, il commence par SOLAIRE1:")}return}
});

buildForms();
renderCompanyHeader();
syncInputs();
showTab(["pv","pump","bom","proj"].includes(S.tab)?S.tab:"pv");
</script>

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");
</script>
